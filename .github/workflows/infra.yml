name: Infra (Bicep)

# Toggle live Azure checks & deployments via GitHub Repo Variable:
#   AZURE_DEPLOY_ENABLED = 'true'  -> enables PR What-If and main Bicep deploy
#   unset / 'false' (default)      -> skips all live Azure calls (safe when resources are deleted)
# Optional: set INFRA_BUILD_ENABLED = 'false' to also skip offline Bicep syntax/lint compilation.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy Bicep to dev (overrides AZURE_DEPLOY_ENABLED when true)'
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/infra.yml'

permissions:
  id-token: write
  contents: read

env:
  RG_NAME: rg-azurelab-ndvd-dev2-cin
  BICEP_FILE: infra/bicep/main.bicep
  DEV_PARAMS: infra/bicep/params/dev.bicepparam
  AZURELAB_OWNER: ${{ vars.AZURELAB_OWNER }}
  AZURELAB_SQL_ADMIN_LOGIN: ${{ vars.AZURELAB_SQL_ADMIN_LOGIN }}
  AZURELAB_SQL_ADMIN_OID: ${{ vars.AZURELAB_SQL_ADMIN_OID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURELAB_API_CLIENT_ID: ${{ vars.AZURELAB_API_CLIENT_ID }}
  ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}

jobs:
  bicep-lint:
    name: Bicep Build & Lint (Offline)
    if: vars.INFRA_BUILD_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bicep build & lint (offline)
        run: |
          az bicep build --file ${{ env.BICEP_FILE }} --stdout > /dev/null
          az bicep build-params --file ${{ env.DEV_PARAMS }} --stdout > /dev/null

  what-if:
    name: Bicep What-If (Dev)
    if: github.event_name == 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep What-If (Dev)
        run: |
          {
            echo "### Bicep What-If (dev)"
            echo '```'
            az deployment group what-if \
              --resource-group ${{ env.RG_NAME }} \
              --parameters ${{ env.DEV_PARAMS }} \
              --no-pretty-print
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    if: >-
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
      )
    needs: []
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (Dev)
        run: |
          az deployment group create \
            --resource-group ${{ env.RG_NAME }} \
            --parameters ${{ env.DEV_PARAMS }}

  # Pattern for prod: requires 'prod' Environment reviewer approval in GitHub UI
