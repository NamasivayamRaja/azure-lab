name: Apps (API, Worker, Functions)

# Toggle live Azure deployments via GitHub Repo Variable:
#   AZURE_DEPLOY_ENABLED = 'true'  -> enables artifact upload & deploy-dev on push to main
#   unset / 'false' (default)      -> runs CI build verification only; skips Azure deployment

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Azure dev (overrides AZURE_DEPLOY_ENABLED when true)'
        required: false
        type: boolean
        default: false
      ef_only:
        description: 'Run EF Core migrations only (skip app deploys)'
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'AzureLabs.Api/**'
      - 'AzureLab.Worker/**'
      - 'AzureLab.Functions/**'
      - 'AzureLab.Data/**'
      - 'AzureLab.Messaging/**'
      - 'AzureLab.Rag/**'
      - 'AzureLab.Assistant/**'
      - '.github/workflows/apps.yml'
  push:
    branches: [main]
    paths:
      - 'AzureLabs.Api/**'
      - 'AzureLab.Worker/**'
      - 'AzureLab.Functions/**'
      - 'AzureLab.Data/**'
      - 'AzureLab.Messaging/**'
      - 'AzureLab.Rag/**'
      - 'AzureLab.Assistant/**'
      - '.github/workflows/apps.yml'

permissions:
  id-token: write
  contents: read

env:
  RG_NAME: rg-azurelab-ndvd-dev2-cin
  API_APP: app-azurelab-api-dev-cin-jyqvnq
  WORKER_APP: app-azurelab-worker-dev-cin-jyqvnq
  FUNC_APP: func-azurelab-dev-cin-jyqvnq
  SQL_SERVER: sql-azurelab-dev-cin-jyqvnq
  SQL_DB: sqldb-azurelab-dev-cin

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' && (inputs.ef_only && 'false' || 'true') || steps.changes.outputs.api }}
      worker: ${{ github.event_name == 'workflow_dispatch' && (inputs.ef_only && 'false' || 'true') || steps.changes.outputs.worker }}
      functions: ${{ github.event_name == 'workflow_dispatch' && (inputs.ef_only && 'false' || 'true') || steps.changes.outputs.functions }}
      ef: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.ef }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed apps & dependencies
        if: github.event_name != 'workflow_dispatch'
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'AzureLabs.Api/**'
              - 'AzureLab.Data/**'
              - 'AzureLab.Messaging/**'
              - 'AzureLab.Rag/**'
              - 'AzureLab.Assistant/**'
              - '.github/workflows/apps.yml'
            worker:
              - 'AzureLab.Worker/**'
              - 'AzureLab.Data/**'
              - 'AzureLab.Messaging/**'
              - '.github/workflows/apps.yml'
            functions:
              - 'AzureLab.Functions/**'
              - 'AzureLab.Data/**'
              - 'AzureLab.Messaging/**'
              - 'AzureLab.Rag/**'
              - '.github/workflows/apps.yml'
            ef:
              - 'AzureLab.Data/Migrations/**'
              - '.github/workflows/apps.yml'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build & Publish API
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true'
        run: dotnet publish AzureLabs.Api/AzureLabs.Api.csproj -c Release -o publish/api

      - name: Build & Publish Worker
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.worker == 'true'
        run: dotnet publish AzureLab.Worker/AzureLab.Worker.csproj -c Release -o publish/worker

      - name: Build & Publish Functions
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.functions == 'true'
        run: dotnet publish AzureLab.Functions/AzureLab_Functions.csproj -c Release -o publish/functions

      - name: Build EF Migrations Bundle
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ef == 'true'
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef migrations bundle \
            --project AzureLab.Data/AzureLab.Data.csproj \
            --startup-project AzureLabs.Api/AzureLabs.Api.csproj \
            --self-contained -r linux-x64 \
            --force -o publish/efbundle

      - name: Upload publish artifacts
        if: >-
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true') ||
            (github.event_name == 'workflow_dispatch' && (vars.AZURE_DEPLOY_ENABLED == 'true' || inputs.deploy == true))
          ) &&
          (github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true' || steps.changes.outputs.worker == 'true' || steps.changes.outputs.functions == 'true' || steps.changes.outputs.ef == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: app-packages
          path: publish/
          include-hidden-files: true
          retention-days: 3

  deploy-dev:
    if: >-
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true') ||
        (github.event_name == 'workflow_dispatch' && (vars.AZURE_DEPLOY_ENABLED == 'true' || inputs.deploy == true))
      ) &&
      (needs.build-and-publish.outputs.api == 'true' || needs.build-and-publish.outputs.worker == 'true' || needs.build-and-publish.outputs.functions == 'true' || needs.build-and-publish.outputs.ef == 'true')
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download publish artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-packages
          path: publish/

      - name: Zip packages
        run: |
          if [ -d publish/api ]; then (cd publish/api && zip -r ../../api.zip .); fi
          if [ -d publish/worker ]; then (cd publish/worker && zip -r ../../worker.zip .); fi
          if [ -d publish/functions ]; then (cd publish/functions && zip -r ../../functions.zip .); fi

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run EF Core Migrations in Private VNet (ephemeral ACI in snet-aci)
        if: needs.build-and-publish.outputs.ef == 'true'
        run: |
          ACI_NAME="aci-ef-migrate-${{ github.run_id }}"
          UAMI_ID="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-azurelab-ndvd-shared-cin/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-azurelab-github-dev-cin"
          SUBNET_ID="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RG_NAME }}/providers/Microsoft.Network/virtualNetworks/vnet-azurelab-dev-cin/subnets/snet-aci"
          REPO_URL="https://github.com/${{ github.repository }}.git"

          az container create \
            --resource-group ${{ env.RG_NAME }} \
            --name "$ACI_NAME" \
            --location centralindia \
            --image mcr.microsoft.com/dotnet/sdk:10.0-noble \
            --os-type Linux \
            --cpu 1 --memory 2 \
            --restart-policy Never \
            --subnet "$SUBNET_ID" \
            --assign-identity "$UAMI_ID" \
            --environment-variables REPO_URL="$REPO_URL" COMMIT_SHA="${{ github.sha }}" SQL_SERVER="${{ env.SQL_SERVER }}" SQL_DB="${{ env.SQL_DB }}" AZURE_CLIENT_ID="${{ vars.AZURE_CLIENT_ID }}" \
            --command-line "/bin/bash -c 'set -euo pipefail; echo \"=== DNS check ===\"; getent hosts \"\${SQL_SERVER}.database.windows.net\"; git clone --depth 1 \"\$REPO_URL\" /src && cd /src && git fetch --depth 1 origin \"\$COMMIT_SHA\" && git checkout \"\$COMMIT_SHA\"; dotnet restore AzureLabs.Api/AzureLabs.Api.csproj; dotnet tool install --global dotnet-ef --version 10.*; export PATH=\"\$PATH:\$HOME/.dotnet/tools\"; CONN=\"Server=tcp:\${SQL_SERVER}.database.windows.net,1433;Database=\${SQL_DB};Authentication=Active Directory Managed Identity;User Id=\${AZURE_CLIENT_ID};Encrypt=True;TrustServerCertificate=False;Connection Timeout=120\"; dotnet ef database update --project AzureLab.Data/AzureLab.Data.csproj --startup-project AzureLabs.Api/AzureLabs.Api.csproj --connection \"\$CONN\"'" \
            --no-wait

          for i in $(seq 1 40); do
            STATE=$(az container show -g ${{ env.RG_NAME }} -n "$ACI_NAME" --query "containers[0].instanceView.currentState.state" -o tsv 2>/dev/null || echo "Pending")
            echo "Poll $i: ACI state=$STATE"
            if [ "$STATE" = "Terminated" ]; then break; fi
            sleep 10
          done

          echo "=== ACI Migration Logs ==="
          az container logs -g ${{ env.RG_NAME }} -n "$ACI_NAME" || true
          EXIT_CODE=$(az container show -g ${{ env.RG_NAME }} -n "$ACI_NAME" --query "containers[0].instanceView.currentState.exitCode" -o tsv)
          echo "ACI exitCode=$EXIT_CODE"
          [ "$EXIT_CODE" = "0" ]

      - name: Delete ephemeral migration ACI container (always)
        if: always() && needs.build-and-publish.outputs.ef == 'true'
        run: |
          az container delete -g ${{ env.RG_NAME }} -n "aci-ef-migrate-${{ github.run_id }}" --yes || true

      - name: Deploy, smoke-test & swap API (staging -> prod, then stop staging)
        if: needs.build-and-publish.outputs.api == 'true'
        run: |
          az webapp start -g ${{ env.RG_NAME }} -n ${{ env.API_APP }} --slot staging
          az webapp deploy \
            --resource-group ${{ env.RG_NAME }} \
            --name ${{ env.API_APP }} \
            --slot staging \
            --src-path api.zip \
            --type zip \
            --timeout 600000
          API_STAGING_HOST=$(az webapp show -g ${{ env.RG_NAME }} -n ${{ env.API_APP }} --slot staging --query defaultHostName -o tsv)
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://${API_STAGING_HOST}/health"
          az webapp deployment slot swap \
            --resource-group ${{ env.RG_NAME }} \
            --name ${{ env.API_APP }} \
            --slot staging \
            --target-slot production
          az webapp stop -g ${{ env.RG_NAME }} -n ${{ env.API_APP }} --slot staging

      - name: Deploy, smoke-test & swap Functions (staging -> prod, then stop staging)
        if: needs.build-and-publish.outputs.functions == 'true'
        run: |
          az functionapp start -g ${{ env.RG_NAME }} -n ${{ env.FUNC_APP }} --slot staging
          az webapp deploy \
            --resource-group ${{ env.RG_NAME }} \
            --name ${{ env.FUNC_APP }} \
            --slot staging \
            --src-path functions.zip \
            --type zip \
            --timeout 600000
          FUNC_STAGING_HOST=$(az functionapp show -g ${{ env.RG_NAME }} -n ${{ env.FUNC_APP }} --slot staging --query defaultHostName -o tsv)
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://${FUNC_STAGING_HOST}/api/health"
          az functionapp deployment slot swap \
            --resource-group ${{ env.RG_NAME }} \
            --name ${{ env.FUNC_APP }} \
            --slot staging \
            --target-slot production
          az functionapp stop -g ${{ env.RG_NAME }} -n ${{ env.FUNC_APP }} --slot staging

      - name: Deploy Worker (direct with graceful shutdown)
        if: needs.build-and-publish.outputs.worker == 'true'
        run: |
          az webapp deploy \
            --resource-group ${{ env.RG_NAME }} \
            --name ${{ env.WORKER_APP }} \
            --src-path worker.zip \
            --type zip \
            --timeout 600000

      - name: Smoke test production
        if: needs.build-and-publish.outputs.api == 'true' || needs.build-and-publish.outputs.functions == 'true'
        run: |
          if [ "${{ needs.build-and-publish.outputs.api }}" = "true" ]; then
            API_HOST=$(az webapp show -g ${{ env.RG_NAME }} -n ${{ env.API_APP }} --query defaultHostName -o tsv)
            curl --fail --retry 6 --retry-delay 5 --retry-all-errors "https://${API_HOST}/health"
          fi
          if [ "${{ needs.build-and-publish.outputs.functions }}" = "true" ]; then
            FUNC_HOST=$(az functionapp show -g ${{ env.RG_NAME }} -n ${{ env.FUNC_APP }} --query defaultHostName -o tsv)
            curl --fail --retry 6 --retry-delay 5 --retry-all-errors "https://${FUNC_HOST}/api/health"
          fi
